{% load l10n dashboard_visuals %}<div class="visit-breakdown">{% for item in chart %}<div><strong>{{ item.label }} · {{ item.total }} بازدید</strong>{% visit_stack item %}<small>{{ item.done }} انجام‌شده · {{ item.pending }} باقی‌مانده · {{ item.unknown }} تعیین‌نشده</small></div>{% empty %}<p>داده‌ای برای این انتخاب وجود ندارد.</p>{% endfor %}</div>
