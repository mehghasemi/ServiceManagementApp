{% load l10n %}<div class="visit-breakdown">{% for item in chart %}<div><strong>{{ item.label }} · {{ item.total }} بازدید</strong><div class="visit-stack" aria-hidden="true"><span class="visit-done" style="width:{{ item.done_width|unlocalize }}%"></span><span class="visit-pending" style="width:{{ item.pending_width|unlocalize }}%"></span><span class="visit-unknown" style="width:{{ item.unknown_width|unlocalize }}%"></span></div><small>{{ item.done }} انجام‌شده · {{ item.pending }} باقی‌مانده · {{ item.unknown }} تعیین‌نشده</small></div>{% empty %}<p>داده‌ای برای این انتخاب وجود ندارد.</p>{% endfor %}</div>
