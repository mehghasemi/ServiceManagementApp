{% load l10n %}{% if city_columns.bars %}<div class="city-chart-scroll" tabindex="0" role="region" aria-label="نمودار شهرها؛ برای شهرهای بیشتر افقی پیمایش کنید"><svg class="city-columns" viewBox="0 0 {{ city_columns.width }} 285" style="min-width:{{ city_columns.width }}px" role="group" aria-label="تعداد برنامه بازدید دوره‌ای به تفکیک شهر"><text x="15" y="20">تعداد</text>{% for tick in city_columns.ticks %}<line x1="45" x2="{{ city_columns.width }}" y1="{{ tick.y|unlocalize }}" y2="{{ tick.y|unlocalize }}" class="city-grid"/><text x="38" y="{{ tick.y|unlocalize }}" text-anchor="end" dominant-baseline="middle">{{ tick.value }}</text>{% endfor %}<line x1="45" x2="45" y1="30" y2="210" class="city-axis"/>{% for item in city_columns.bars %}<a href="{{ item.url }}" aria-label="نمایش بازدیدهای {{ item.label }}"><rect x="{{ item.x }}" y="{{ item.y|unlocalize }}" width="32" height="{{ item.height|unlocalize }}" class="city-bar"><title>{{ item.label }}: {{ item.total }} بازدید</title></rect><text x="{{ item.x|add:16 }}" y="{{ item.y|add:'-7'|unlocalize }}" text-anchor="middle">{{ item.total }}</text><text x="{{ item.x|add:16 }}" y="{{ item.label_y }}" text-anchor="middle">{{ item.label }}</text></a>{% endfor %}</svg></div><p class="chart-note">شهر مرکز · تعداد برنامه‌های بازدید در ریلیز انتخابی؛ به معنی بازدید انجام‌شده نیست.</p>{% else %}<p class="empty">برنامه بازدیدی برای این انتخاب دریافت نشده است.</p>{% endif %}
