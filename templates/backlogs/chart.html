{% load l10n %}<div class="bar-chart compact-chart">{% for item in chart %}<div class="bar-row"><div class="bar-label"><span>{{ item.label }}</span><strong>{{ item.count }}</strong></div><svg viewBox="0 0 100 7" preserveAspectRatio="none" aria-hidden="true"><rect class="bar-track" width="100" height="7" rx="3"/><rect class="bar-fill" width="{{ item.width|unlocalize }}" height="7" rx="3"/></svg></div>{% empty %}<p class="muted">داده منطبق موجود نیست.</p>{% endfor %}</div>
