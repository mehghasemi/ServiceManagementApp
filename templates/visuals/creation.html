{% load l10n %}<p class="chart-note">۶ ماه شمسی اخیر · ماه جاری کامل نشده · زمان ایجاد رکوردهای View فعلی، نه تاریخچه حجم کار</p><svg class="creation-area" viewBox="0 0 560 195" role="img" aria-label="نمودار ماه ایجاد کیس‌های انتخاب‌شده"><defs><linearGradient id="creation-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="currentColor" stop-opacity=".4"/><stop offset="100%" stop-color="currentColor" stop-opacity=".02"/></linearGradient></defs><path d="M30 30H530 M30 90H530 M30 150H530" class="chart-grid"/>{% if chart_kind != 'line' %}<polygon points="{{ creation.area }}" fill="url(#creation-fill)"/>{% endif %}<polyline points="{{ creation.points }}" fill="none" stroke="currentColor" stroke-width="3"/>{% for item in creation.rows %}<a href="{{ item.url }}" aria-label="نمایش کیس‌های ایجادشده در {{ item.label }}"><circle cx="{{ item.x }}" cy="{{ item.y|unlocalize }}" r="4" fill="currentColor"/><text x="{{ item.x }}" y="{{ item.y|add:'-10'|unlocalize }}" text-anchor="middle">{{ item.count }}</text><text x="{{ item.x }}" y="183" text-anchor="middle">{{ item.label }}</text></a>{% endfor %}</svg>
<details><summary>اعداد نمودار</summary><ul class="chart-values">{% for item in creation.rows %}<li><a href="{{ item.url }}">{{ item.label }}: {{ item.count }} کیس</a></li>{% endfor %}</ul></details>
