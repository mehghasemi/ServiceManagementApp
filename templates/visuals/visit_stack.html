{% load l10n %}<svg class="visit-stack-svg" viewBox="0 0 100 8" preserveAspectRatio="none" role="group" aria-label="وضعیت بازدیدهای مرکز">{% if done_url %}<a href="{{ done_url }}" aria-label="بازدیدهای انجام‌شده">{% endif %}<rect class="visit-done" x="0" width="{{ done|unlocalize }}" height="8"/>{% if done_url %}</a>{% endif %}{% if pending_url %}<a href="{{ pending_url }}" aria-label="بازدیدهای باقی‌مانده">{% endif %}<rect class="visit-pending" x="{{ done|unlocalize }}" width="{{ pending|unlocalize }}" height="8"/>{% if pending_url %}</a>{% endif %}{% if unknown_url %}<a href="{{ unknown_url }}" aria-label="بازدیدهای نامشخص">{% endif %}<rect class="visit-unknown" x="{{ unknown_start|unlocalize }}" width="{{ unknown|unlocalize }}" height="8"/>{% if unknown_url %}</a>{% endif %}</svg>
