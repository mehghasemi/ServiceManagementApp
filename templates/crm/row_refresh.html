<span class="row-refresh-controls">{% if user.is_staff %}<form method="post" action="{{ refresh_url }}">{% csrf_token %}<button class="small-button icon-button row-sync" aria-label="بازخوانی این مورد و یادداشت‌های مرتبط" data-tooltip="بازخوانی همین مورد و تمام یادداشت‌های مرتبطِ قابل دسترس در View انتخابی"><span aria-hidden="true">↻</span></button></form>{% endif %}<button type="button" class="help row-freshness {% if snapshot.coverage.notes %}has-notes{% else %}missing-notes{% endif %}" aria-label="وضعیت آخرین دریافت این مورد" data-refresh-time="{{ stamp }}" data-notes-status="{% if snapshot.coverage.notes %}یادداشت‌های View انتخابی دریافت شده‌اند؛ نبود یادداشت در این View به معنی نبود آن در کل CRM نیست.{% else %}یادداشت‌ها دریافت نشده‌اند. در تنظیمات همین ماژول View یادداشت‌ها را انتخاب کنید و دریافت کامل انجام دهید.{% endif %}" data-help="آخرین دریافت موفق: {{ stamp }}. {% if snapshot.coverage.notes %}یادداشت‌های View انتخابی دریافت شده‌اند.{% else %}یادداشت‌ها دریافت نشده‌اند؛ View یادداشت را در تنظیمات همین ماژول انتخاب کنید.{% endif %}" data-tooltip="آخرین دریافت موفق: {{ stamp }}"><span aria-hidden="true">◷</span></button></span>
