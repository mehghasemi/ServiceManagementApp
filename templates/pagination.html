<nav class="pagination" aria-label="صفحه‌بندی {{ position }}">{% if page.has_previous %}<a href="{% querystring page=1 %}">اول</a><a href="{% querystring page=page.previous_page_number %}">قبلی</a>{% endif %}<span>صفحه {{ page.number }} از {{ page.paginator.num_pages }} · {{ page.start_index }}–{{ page.end_index }} از {{ page.paginator.count }}</span>{% if page.has_next %}<a href="{% querystring page=page.next_page_number %}">بعدی</a><a href="{% querystring page=page.paginator.num_pages %}">آخر</a>{% endif %}</nav>
